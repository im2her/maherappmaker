workflows:
  android-workflow:
    name: Android Store Build
    environment:
      node: 20
      java: 21
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build Web App
        script: npm run build
      - name: Force Init and Sync Android
        script: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Maher App" "sa.maher.app" --web-dir dist || true
          npx cap add android || true
          npx cap sync android
      - name: Fix Kotlin Duplicate Classes
        script: |
          cat <<EOF >> android/app/build.gradle
          configurations {
              all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF
      - name: Auto Generate Keystore and Build Release
        script: |
          cd android
          # توليد المفتاح
          keytool -genkey -v -keystore maher.keystore -alias maher-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass MaherPassword123 -keypass MaherPassword123 -dname "CN=Maher, O=MaherAI, C=SA"
          
          # استخدام المسار الكامل $PWD عشان جرادل ما يضيع الملف
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$PWD/maher.keystore \
            -Pandroid.injected.signing.store.password=MaherPassword123 \
            -Pandroid.injected.signing.key.alias=maher-alias \
            -Pandroid.injected.signing.key.password=MaherPassword123
    artifacts:
      - android/app/build/outputs/**/*.aab
