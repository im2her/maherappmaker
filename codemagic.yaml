workflows:
  android-workflow:
    name: Android Build
    environment:
      node: 20
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build Web App
        script: npm run build
      - name: Force Init and Sync Android
        script: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Maher App" "sa.maher.app" --web-dir dist || true
          npx cap add android || true
          npx cap sync android
      - name: Build Android APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
