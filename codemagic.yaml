# Codemagic configuration for React + Capacitor App (Maher App)
workflows:
  cap-android:
    name: Build React-Capacitor Android
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: latest
      java: 17
    triggering:
      events:
        - push
      branches:
        - main
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build React Web App
        script: |
          npm run build
      - name: Sync React assets to Capacitor Native Android
        script: |
          npx cap sync android
      - name: Set output type or package name (gradle properties)
        script: |
          cd android
          chmod +x gradlew
      - name: Assemble Android APK (Debug Version)
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

  cap-ios:
    name: Build React-Capacitor iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branches:
        - main
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build React Web App
        script: |
          npm run build
      - name: Sync React assets to Capacitor Native iOS
        script: |
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Build iOS App (.app / Xcode build)
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.app
